name: Sync fork with upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_UPSTREAM_PAT || github.token }}

      - name: Merge upstream main into fork
        env:
          SYNC_UPSTREAM_PAT: ${{ secrets.SYNC_UPSTREAM_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          # `-X ours` auto-resolves text conflicts but NOT modify/delete. Reconcile the remainder:
          # workflow paths adopt upstream when a PAT lets us push them, else stay with the fork;
          # any other unmerged path keeps the fork's side (deletion − consistent with -X ours).
          if ! git merge --no-edit -X ours upstream/main; then
            wf=$(git diff --name-only --diff-filter=U -- .github/workflows)
            if [ -n "$wf" ]; then
              if [ -n "$SYNC_UPSTREAM_PAT" ]; then
                git checkout upstream/main -- $wf
              else
                git rm -f -q -- $wf
              fi
              git add $wf
            fi
            other=$(git diff --name-only --diff-filter=U)
            if [ -n "$other" ]; then
              git rm -f -q -- $other
            fi
            git commit --no-edit -q
          fi
          after=$(git rev-parse HEAD)
          # GITHUB_TOKEN cannot push commits touching .github/workflows/* (no `workflows` scope;
          # it is not grantable via `permissions:`). Unless a PAT is configured, keep the fork's
          # own workflow files in the sync commit so the push is never rejected.
          if [ -z "$SYNC_UPSTREAM_PAT" ] && [ "$before" != "$after" ] \
              && ! git diff --quiet "$before" "$after" -- .github/workflows; then
            git rm -r -q .github/workflows
            git checkout "$before" -- .github/workflows
            git commit --amend --no-edit -q
          fi
          git push origin main
