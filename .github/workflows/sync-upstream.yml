name: Sync fork with upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_UPSTREAM_PAT || github.token }}

      - name: Merge upstream main into fork
        env:
          SYNC_UPSTREAM_PAT: ${{ secrets.SYNC_UPSTREAM_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          # --tags is explicit: the merge needs upstream main, and the tag mirror below
          # needs upstream's tag namespace. Relying on auto-followed tags would make the
          # mirror depend on which tags happen to be reachable from the fetched history.
          git fetch --tags upstream main
          before=$(git rev-parse HEAD)
          # `-X ours` auto-resolves text conflicts but NOT modify/delete, and `git rm` refuses
          # those paths. Stage the worktree to clear every unmerged entry; the PAT posture
          # below then decides whether the workflow files actually ship in the push.
          if ! git merge --no-edit -X ours upstream/main; then
            git add -A -- .
            git commit --no-edit -q
          fi
          after=$(git rev-parse HEAD)
          # GITHUB_TOKEN cannot push commits touching .github/workflows/* (no `workflows` scope;
          # it is not grantable via `permissions:`). Unless a PAT is configured, keep the fork's
          # own workflow files in the sync commit so the push is never rejected.
          if [ -z "$SYNC_UPSTREAM_PAT" ] && [ "$before" != "$after" ] \
              && ! git diff --quiet "$before" "$after" -- .github/workflows; then
            git rm -r -q .github/workflows
            git checkout "$before" -- .github/workflows
            git commit --amend --no-edit -q
          fi
          git push origin main

      - name: Mirror upstream release tags
        run: |
          set -euo pipefail
          # A fork carries none of upstream's tags, and hermes_cli/version_info.py reads
          # the nearest release tag to name the checkout (falling back to the CalVer
          # tag's pyproject version). Without this mirror every sync re-creates the
          # "unknown" version that a tagless clone reports.
          #
          # Non-fatal and unforced: the sync above has already landed, a rejected tag
          # must not make it look failed, and plain --tags never overwrites or deletes
          # a tag the fork already has. The next scheduled run retries.
          if ! git push origin --tags; then
            echo "::warning::release tag mirror incomplete; next scheduled run retries"
          fi
